[menu]
menuitem=desktop, TaijiOS Desktop
menuitem=text, TaijiOS Console
menudefault=desktop,3

[desktop]
vgasize=1024x768x32
q9unix=1
q9web=1
mouseport=ps2intellimouse
monitor=vesa

[text]
vgasize=none
q9mode=text
q9unix=0
mouseport=none
monitor=none

[common]
sysname=taiji
*nobiosload=1
partition=new
factotumopts=-n
user=glenda
console=0 b115200
*nomp=1
*nowatchdog=1
nousbboot=1
q9fast=1
nobootprompt=local!#S/sdC0/gzroot
bootfile=sdC0!9fat!9pcgz.gz
