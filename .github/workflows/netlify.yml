name: Netlify

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NETLIFY_SITE_ID: 0721a6c3-b148-4660-aa68-9a226255654a

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Site
        run: |
          set -euo pipefail
          make site
          test -f build/site/index.html
          test -f build/site/favicon.ico
          test -f build/site/css/style.css
          test -f build/site/js/taijios-web.js
          test -f build/site/assets/taijios-desktop.png
          test -f build/site/assets/taijios-web.raw
          test -f build/site/assets/v86/libv86.js
          test -f build/site/assets/v86/v86.wasm
          test -f build/site/assets/v86/seabios.bin
          test -f build/site/assets/v86/vgabios.bin

      - name: Upload Site Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taijios-site
          path: build/site
          if-no-files-found: error

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Download Site Artifact
        uses: actions/download-artifact@v4
        with:
          name: taijios-site
          path: build/site

      - name: Check Netlify Secrets
        id: netlify
        run: |
          set -euo pipefail
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Netlify preview deploy because NETLIFY_AUTH_TOKEN is not configured."
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Install Netlify CLI
        if: steps.netlify.outputs.configured == 'true'
        run: npm install --global netlify-cli

      - name: Deploy Preview To Netlify
        if: steps.netlify.outputs.configured == 'true'
        run: |
          set -euo pipefail
          auth_token="$(printf '%s' "$NETLIFY_AUTH_TOKEN" | tr -d '\r\n')"
          site_id="$(printf '%s' "$NETLIFY_SITE_ID" | tr -d '\r\n')"
          test -n "$auth_token" || { echo "::error::NETLIFY_AUTH_TOKEN is empty or missing"; exit 1; }
          test -n "$site_id" || { echo "::error::NETLIFY_SITE_ID is empty or missing"; exit 1; }
          netlify deploy \
            --dir build/site \
            --no-build \
            --alias "pr-${{ github.event.pull_request.number }}" \
            --message "Preview ${{ github.event.pull_request.number }}" \
            --auth "$auth_token" \
            --site "$site_id"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'

    steps:
      - name: Download Site Artifact
        uses: actions/download-artifact@v4
        with:
          name: taijios-site
          path: build/site

      - name: Check Netlify Secrets
        id: netlify
        run: |
          set -euo pipefail
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Netlify production deploy because NETLIFY_AUTH_TOKEN is not configured."
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Install Netlify CLI
        if: steps.netlify.outputs.configured == 'true'
        run: npm install --global netlify-cli

      - name: Deploy Production To Netlify
        if: steps.netlify.outputs.configured == 'true'
        run: |
          set -euo pipefail
          auth_token="$(printf '%s' "$NETLIFY_AUTH_TOKEN" | tr -d '\r\n')"
          site_id="$(printf '%s' "$NETLIFY_SITE_ID" | tr -d '\r\n')"
          test -n "$auth_token" || { echo "::error::NETLIFY_AUTH_TOKEN is empty or missing"; exit 1; }
          test -n "$site_id" || { echo "::error::NETLIFY_SITE_ID is empty or missing"; exit 1; }
          netlify deploy \
            --dir build/site \
            --no-build \
            --prod \
            --message "Production ${{ github.sha }}" \
            --auth "$auth_token" \
            --site "$site_id"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
